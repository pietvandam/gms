<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Meldkamer Systeem 2025</title>
<style>
  :root{
    --bg-0:#11142b; --bg-1:#1a1f3d; --bg-2:#232a52; --bg-3:#2c3462; --line:#343d6e;
    --text:#eef0fb; --muted:#9aa3c7; --blue:#3d7bff; --blue-d:#2e5fd6; --red:#e14b3f; --red-d:#c93a2f;
    --green:#33c481; --amber:#e8b64a; --radius:14px; --shadow:0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;
    background:radial-gradient(1200px 800px at 20% -10%, #1c2350 0%, var(--bg-0) 55%); color:var(--text); min-height:100vh;}
  #app{min-height:100vh; display:flex; flex-direction:column;}

  .login-wrap{flex:1; display:flex; align-items:center; justify-content:center; padding:24px;}
  .login-card{background:linear-gradient(180deg, var(--bg-1), var(--bg-0)); border:1px solid var(--line);
    border-radius:20px; padding:40px; width:100%; max-width:560px; box-shadow:var(--shadow);}
  .login-title{font-size:22px; font-weight:700; margin:0 0 4px;}
  .login-sub{color:var(--muted); margin:0 0 28px; font-size:14px;}
  .role-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  @media (max-width:560px){ .role-grid{grid-template-columns:1fr;} }
  .role-btn{background:var(--bg-2); border:1px solid var(--line); border-radius:var(--radius); padding:22px 10px;
    color:var(--text); cursor:pointer; text-align:center; font-size:14px; font-weight:600; transition:.15s;}
  .role-btn:hover{background:var(--bg-3); border-color:var(--blue); transform:translateY(-2px);}
  .role-emoji{font-size:28px; display:block; margin-bottom:8px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em;}
  .field input, .field select, .field textarea{width:100%; background:var(--bg-0); border:1px solid var(--line); color:var(--text);
    padding:10px 12px; border-radius:10px; font-size:14px; font-family:inherit;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--blue);}
  .dienst-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px;}
  .dienst-opt{background:var(--bg-2); border:2px solid var(--line); border-radius:12px; padding:14px 6px; text-align:center; cursor:pointer; font-size:12px; font-weight:600;}
  .dienst-opt .em{font-size:22px; display:block; margin-bottom:6px;}
  .dienst-opt.sel{border-color:var(--blue); background:var(--bg-3);}
  .btn{background:var(--blue); border:none; color:#fff; padding:12px 18px; border-radius:10px; font-weight:700; font-size:14px; cursor:pointer; transition:.15s;}
  .btn:hover{background:var(--blue-d);}
  .btn.wide{width:100%;}
  .btn.ghost{background:transparent; border:1px solid var(--line); color:var(--text);}
  .btn.ghost:hover{border-color:var(--blue);}
  .btn.discord{background:#5865F2;}
  .btn.discord:hover{background:#4a55d6;}
  .back-link{color:var(--muted); font-size:13px; cursor:pointer; margin-bottom:16px; display:inline-block;}
  .back-link:hover{color:var(--text);}

  .topbar{display:flex; align-items:center; justify-content:space-between; padding:14px 22px; background:var(--bg-1); border-bottom:1px solid var(--line); flex-wrap:wrap; gap:10px;}
  .topbar-left{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .brand{font-weight:800; font-size:15px;}
  .brand .sub{color:var(--muted); font-weight:400; font-size:12px; margin-left:8px;}
  .pill{background:var(--bg-2); border:1px solid var(--line); border-radius:999px; padding:6px 14px; font-size:13px; font-weight:600;}
  .topbar-right{display:flex; align-items:center; gap:12px;}
  .clock{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums;}
  .logout{background:var(--bg-2); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:8px 12px; cursor:pointer; font-size:13px;}
  .logout:hover{border-color:var(--red); color:var(--red);}

  .board{flex:1; display:grid; gap:16px; padding:18px; grid-template-columns:repeat(4,1fr); align-items:start;}
  @media (max-width:1300px){ .board{grid-template-columns:1fr 1fr;} }
  @media (max-width:700px){ .board{grid-template-columns:1fr;} }
  .panel{background:var(--bg-1); border:1px solid var(--line); border-radius:var(--radius); display:flex; flex-direction:column; overflow:hidden; box-shadow:var(--shadow);}
  .panel-head{display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--bg-2); font-weight:700; font-size:13px; gap:8px;}
  .panel-head .icon-btn{background:var(--blue); border:none; color:#fff; width:26px; height:26px; border-radius:8px; cursor:pointer; font-size:16px; line-height:1; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .panel-body{padding:12px; flex:1; overflow-y:auto; min-height:100px; max-height:38vh;}
  .empty-hint{color:var(--muted); font-size:13px; padding:8px 4px;}

  .melding-card{background:var(--bg-2); border:1px solid var(--line); border-left:4px solid var(--amber); border-radius:10px; padding:10px 12px; margin-bottom:10px; cursor:pointer; transition:.12s;}
  .melding-card:hover{border-color:var(--blue);}
  .melding-card.drag-over{border-color:var(--blue); background:var(--bg-3); box-shadow:0 0 0 2px var(--blue) inset;}
  .melding-card.uitgegeven{border-left-color:var(--green);}
  .melding-card .m-top{display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-bottom:4px;}
  .melding-card .m-tekst{font-size:13px; line-height:1.4;}
  .melding-card .m-tags{margin-top:6px; font-size:11px; color:var(--muted);}

  .unit-row{display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--bg-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; cursor:grab;}
  .unit-row:hover{border-color:var(--blue);}
  .unit-row.dragging{opacity:.4;}
  .unit-row .u-left{display:flex; align-items:center; gap:10px; min-width:0;}
  .unit-em{font-size:18px; flex-shrink:0;}
  .u-name{font-weight:700; font-size:13px; display:flex; align-items:center;}
  .u-sub{font-size:11px; color:var(--muted);}
  .u-status{font-size:11px; font-weight:700; padding:4px 9px; border-radius:999px; white-space:nowrap;}
  .u-status.inzetbaar{background:rgba(51,196,129,.15); color:var(--green);}
  .u-status.aanrijdend{background:rgba(232,182,74,.15); color:var(--amber);}
  .u-status.terplaatse{background:rgba(61,123,255,.15); color:var(--blue);}
  .u-status.niet{background:rgba(225,75,63,.15); color:var(--red);}
  .u-status.retour{background:rgba(154,163,199,.15); color:var(--muted);}
  .u-status.eigen{background:rgba(61,123,255,.15); color:var(--blue);}
  .online-dot{width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:7px; flex-shrink:0;}
  .online-dot.on{background:var(--green); box-shadow:0 0 6px var(--green);}
  .online-dot.off{background:var(--muted);}

  .req-item{background:var(--bg-2); border:1px solid var(--amber); border-radius:10px; padding:9px 12px; margin-bottom:8px; font-size:12px;}
  .req-item.nood{border-color:var(--red);}
  .req-item b{display:block; margin-bottom:2px;}
  .req-actions{display:flex; gap:8px; margin-top:8px;}
  .btn-mini{padding:5px 10px; font-size:11px; border-radius:8px; border:none; cursor:pointer; font-weight:700;}
  .btn-approve{background:var(--green); color:#06301d;}
  .btn-reject{background:var(--red); color:#fff;}
  .status-tag{font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; display:inline-block; margin-top:6px;}
  .status-tag.wachtend{background:rgba(232,182,74,.15); color:var(--amber);}
  .status-tag.goedgekeurd{background:rgba(51,196,129,.15); color:var(--green);}
  .status-tag.afgewezen{background:rgba(225,75,63,.15); color:var(--red);}

  .grid3{display:grid; grid-template-columns:1fr 1fr 1.3fr; gap:16px; padding:18px; flex:1;}
  @media (max-width:980px){ .grid3{grid-template-columns:1fr;} }
  .melding-view{padding:14px; font-size:14px; line-height:1.7; white-space:pre-wrap;}
  textarea.kladblok{width:100%; height:100%; min-height:180px; background:transparent; border:none; color:var(--text); resize:none; font-family:inherit; font-size:14px; padding:14px;}
  textarea.kladblok:focus{outline:none;}
  .status-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; padding:14px;}
  .status-btn{background:var(--bg-2); border:1px solid var(--line); border-radius:12px; color:var(--text); padding:20px 8px; font-weight:700; font-size:13px; cursor:pointer; min-height:74px; display:flex; align-items:center; justify-content:center; text-align:center; transition:.12s;}
  .status-btn:hover{border-color:var(--blue); transform:translateY(-1px);}
  .status-btn:active{transform:scale(.96);}
  .status-btn.active{background:var(--blue); border-color:var(--blue); box-shadow:0 0 0 2px rgba(61,123,255,.4) inset;}
  .status-btn.nood{background:var(--red); border-color:var(--red-d);}
  .status-btn.nood:hover{background:var(--red-d);}
  .toast{position:fixed; top:18px; right:18px; background:var(--green); color:#06301d; font-weight:700; padding:10px 18px; border-radius:10px; box-shadow:var(--shadow); z-index:50; font-size:13px; animation:fade 2.6s forwards;}
  @keyframes fade{0%{opacity:0; transform:translateY(-8px);} 10%{opacity:1; transform:translateY(0);} 85%{opacity:1;} 100%{opacity:0;}}

  .modal-bg{position:fixed; inset:0; background:rgba(10,12,26,.6); display:flex; align-items:center; justify-content:center; z-index:40; padding:20px;}
  .modal{background:var(--bg-1); border:1px solid var(--line); border-radius:16px; padding:24px; width:100%; max-width:460px; box-shadow:var(--shadow);}
  .modal h3{margin:0 0 16px;}
  .modal-actions{display:flex; gap:10px; margin-top:18px;}

  .intake-wait{text-align:center; padding:20px 0;}
  .spinner{width:34px; height:34px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--blue); animation:spin 1s linear infinite; margin:0 auto 16px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .mini-verzoek{background:var(--bg-2); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:6px; font-size:12px; display:flex; justify-content:space-between; align-items:center;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================ CONFIG ============================ */
const DISCORD_LINK = "https://discord.gg/JOUW-SERVER-INVITE"; // <-- vervang door je eigen Discord invite

/* ============================ STATE ============================ */
const STORE_KEY = "meldkamer_state_v2";
let session = null;
let state = { units: [], meldingen: [], verzoeken: [], intakes: [] };
let pollTimer = null;
let intakeWaitTimer = null;
let selectedDienst = null;
let selectedIntakeDienst = null;
let myIntakeId = null;
let seenVerzoekStatus = {};

const DIENSTEN = {
  politie:   { label:"Politie",    em:"🛡️" },
  brandweer: { label:"Brandweer",  em:"🚒" },
  ambulance: { label:"Ambulance",  em:"🚑" },
  overig:    { label:"Overig",     em:"👤" },
};
function statusClass(s){
  if(s==="Inzetbaar") return "inzetbaar";
  if(s==="Aanrijdend") return "aanrijdend";
  if(s==="Ter Plaatse") return "terplaatse";
  if(s==="Niet Inzetbaar") return "niet";
  if(s==="Retour") return "retour";
  if(s==="Eigen Initiatief") return "eigen";
  return "";
}
function uid(){ return Math.random().toString(36).slice(2,10); }
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function isOnline(u){ return u.lastSeen && (Date.now() - u.lastSeen) < 8000; }

/* ============================ STORAGE (gedeelde "database") ============================ */
async function loadState(){
  try{
    const res = await window.storage.get(STORE_KEY, true);
    if(res && res.value){ state = JSON.parse(res.value); }
    if(!state.units) state.units=[];
    if(!state.meldingen) state.meldingen=[];
    if(!state.verzoeken) state.verzoeken=[];
    if(!state.intakes) state.intakes=[];
  }catch(e){
    state = { units: [], meldingen: [], verzoeken: [], intakes: [] };
    await saveState();
  }
}
async function saveState(){
  try{ await window.storage.set(STORE_KEY, JSON.stringify(state), true); }
  catch(e){ console.error("storage error", e); }
}

/* ============================ ROOT RENDER ============================ */
function render(){
  const app = document.getElementById("app");
  if(!session){ renderLogin(app); }
  else if(session.role === "meldkamer"){ renderMeldkamer(app); }
  else { renderHulpdienst(app); }
}

/* ============================ LOGIN ============================ */
function renderLogin(app){
  app.innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <p class="login-title">Meldkamer Systeem 2025</p>
        <p class="login-sub">Kies hoe je wilt inloggen. Alles is realtime gekoppeld — ongeacht stad of eenheid.</p>
        <div class="role-grid">
          <div class="role-btn" id="btnMeldkamer"><span class="role-emoji">🖥️</span>Meldkamer</div>
          <div class="role-btn" id="btnHulpdienst"><span class="role-emoji">🚓</span>Hulpdiensten</div>
          <div class="role-btn" id="btnBurger"><span class="role-emoji">🙋</span>Intake aanvragen<br><span style="font-weight:400; color:var(--muted); font-size:11px;">(als burger inklokken)</span></div>
        </div>
      </div>
    </div>`;
  document.getElementById("btnMeldkamer").onclick = () => renderMeldkamerLogin(app);
  document.getElementById("btnHulpdienst").onclick = () => renderHulpdienstLogin(app);
  document.getElementById("btnBurger").onclick = () => renderBurgerLogin(app);
}

function renderMeldkamerLogin(app){
  app.innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <span class="back-link" id="back">&larr; Terug</span>
        <p class="login-title">Inloggen als Meldkamer</p>
        <p class="login-sub">Vul je standplaats in. Je ziet alle meldingen, eenheden en intakes, ongeacht locatie.</p>
        <div class="field"><label>Standplaats meldkamer</label><input type="text" id="stad" placeholder="bv. Rotterdam"></div>
        <div class="field"><label>Meldkamer naam / kanaal</label><input type="text" id="naam" placeholder="bv. OC/OPS" value="OC/OPS"></div>
        <button class="btn wide" id="go">Inloggen</button>
      </div>
    </div>`;
  document.getElementById("back").onclick = () => renderLogin(app);
  document.getElementById("go").onclick = async () => {
    const stad = document.getElementById("stad").value.trim() || "Onbekend";
    const naam = document.getElementById("naam").value.trim() || "OC/OPS";
    session = { role:"meldkamer", stad, naam };
    await start();
  };
}

function renderHulpdienstLogin(app){
  selectedDienst = null;
  app.innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <span class="back-link" id="back">&larr; Terug</span>
        <p class="login-title">Inloggen als Hulpdienst</p>
        <p class="login-sub">Kies je dienst en vul je eenheidsgegevens in. Je wordt automatisch ingeklokt.</p>
        <div class="dienst-grid" id="diensten">
          ${Object.entries(DIENSTEN).map(([k,v])=>`<div class="dienst-opt" data-k="${k}"><span class="em">${v.em}</span>${v.label}</div>`).join("")}
        </div>
        <div class="field"><label>Roepnummer / callsign</label><input type="text" id="callsign" placeholder="bv. MD22-01"></div>
        <div class="field"><label>Standplaats / stad</label><input type="text" id="stad" placeholder="bv. Amsterdam"></div>
        <button class="btn wide" id="go">Inloggen &amp; inklokken</button>
      </div>
    </div>`;
  document.getElementById("back").onclick = () => renderLogin(app);
  document.querySelectorAll(".dienst-opt").forEach(el=>{
    el.onclick = () => { document.querySelectorAll(".dienst-opt").forEach(o=>o.classList.remove("sel")); el.classList.add("sel"); selectedDienst = el.dataset.k; };
  });
  document.getElementById("go").onclick = async () => {
    if(!selectedDienst){ alert("Kies eerst een dienst."); return; }
    const callsign = document.getElementById("callsign").value.trim();
    const stad = document.getElementById("stad").value.trim() || "Onbekend";
    if(!callsign){ alert("Vul een roepnummer in."); return; }
    await loadState();
    let unit = state.units.find(u => u.callsign.toLowerCase() === callsign.toLowerCase());
    if(!unit){
      unit = { id: uid(), dienst: selectedDienst, callsign, stad, status:"Inzetbaar", meldingId:null, lastSeen: Date.now() };
      state.units.push(unit);
    } else {
      unit.dienst = selectedDienst; unit.stad = stad; unit.lastSeen = Date.now();
    }
    await saveState();
    session = { role:"hulpdienst", unitId: unit.id, dienst: selectedDienst, callsign, stad };
    await start();
  };
}

/* ---- Burger / intake aanvragen ---- */
function renderBurgerLogin(app){
  selectedIntakeDienst = null;
  app.innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <span class="back-link" id="back">&larr; Terug</span>
        <p class="login-title">Intake aanvragen</p>
        <p class="login-sub">Vraag aan om in te klokken bij een hulpdienst. De meldkamer beoordeelt je aanvraag; na goedkeuring krijg je een Discord-link om verder te praten.</p>
        <div class="field"><label>Je naam</label><input type="text" id="bNaam" placeholder="bv. Jan Jansen"></div>
        <div class="field"><label>Gewenste dienst</label>
          <div class="dienst-grid" id="bDiensten">
            ${Object.entries(DIENSTEN).map(([k,v])=>`<div class="dienst-opt" data-k="${k}"><span class="em">${v.em}</span>${v.label}</div>`).join("")}
          </div>
        </div>
        <div class="field"><label>Bericht / reden</label><textarea id="bBericht" rows="3" placeholder="Korte toelichting voor de meldkamer"></textarea></div>
        <button class="btn wide" id="go">Intake aanvragen</button>
      </div>
    </div>`;
  document.getElementById("back").onclick = () => renderLogin(app);
  document.querySelectorAll("#bDiensten .dienst-opt").forEach(el=>{
    el.onclick = () => { document.querySelectorAll("#bDiensten .dienst-opt").forEach(o=>o.classList.remove("sel")); el.classList.add("sel"); selectedIntakeDienst = el.dataset.k; };
  });
  document.getElementById("go").onclick = async () => {
    const naam = document.getElementById("bNaam").value.trim();
    if(!naam){ alert("Vul je naam in."); return; }
    if(!selectedIntakeDienst){ alert("Kies een gewenste dienst."); return; }
    const bericht = document.getElementById("bBericht").value.trim();
    await loadState();
    const intake = { id: uid(), naam, dienst: selectedIntakeDienst, bericht, tijd: new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}), status:"wachtend" };
    state.intakes.push(intake);
    await saveState();
    myIntakeId = intake.id;
    renderIntakeWait(app);
  };
}

function renderIntakeWait(app){
  const intake = state.intakes.find(i=>i.id===myIntakeId);
  if(!intake) return;
  if(intake.status === "wachtend"){
    app.innerHTML = `
      <div class="login-wrap">
        <div class="login-card">
          <div class="intake-wait">
            <div class="spinner"></div>
            <p class="login-title">Wachten op goedkeuring...</p>
            <p class="login-sub">${DIENSTEN[intake.dienst].em} ${DIENSTEN[intake.dienst].label} — ${escapeHtml(intake.naam)}<br>Een meldkamer bekijkt je intake-aanvraag.</p>
            <span class="back-link" id="cancel">Aanvraag annuleren</span>
          </div>
        </div>
      </div>`;
    document.getElementById("cancel").onclick = async () => {
      await loadState();
      state.intakes = state.intakes.filter(i=>i.id!==myIntakeId);
      await saveState();
      myIntakeId = null;
      if(intakeWaitTimer) clearInterval(intakeWaitTimer);
      renderLogin(app);
    };
  } else if(intake.status === "goedgekeurd"){
    if(intakeWaitTimer) clearInterval(intakeWaitTimer);
    app.innerHTML = `
      <div class="login-wrap">
        <div class="login-card">
          <div class="intake-wait">
            <p class="login-title">✅ Je bent ingeklokt!</p>
            <p class="login-sub">${DIENSTEN[intake.dienst].em} Welkom, ${escapeHtml(intake.naam)}. De meldkamer heeft je aanvraag goedgekeurd.<br>Praat verder via Discord:</p>
            <a class="btn discord wide" style="display:block; text-decoration:none; box-sizing:border-box; margin-bottom:12px;" href="${DISCORD_LINK}" target="_blank" rel="noopener">Open Discord</a>
            <span class="back-link" id="back2">&larr; Terug naar login</span>
          </div>
        </div>
      </div>`;
    document.getElementById("back2").onclick = () => { myIntakeId=null; renderLogin(app); };
  } else if(intake.status === "afgewezen"){
    if(intakeWaitTimer) clearInterval(intakeWaitTimer);
    app.innerHTML = `
      <div class="login-wrap">
        <div class="login-card">
          <div class="intake-wait">
            <p class="login-title">❌ Aanvraag afgewezen</p>
            <p class="login-sub">Je intake-aanvraag is helaas niet goedgekeurd door de meldkamer.</p>
            <span class="back-link" id="back2">&larr; Terug naar login</span>
          </div>
        </div>
      </div>`;
    document.getElementById("back2").onclick = () => { myIntakeId=null; renderLogin(app); };
  }
  if(intake.status==="wachtend" && !intakeWaitTimer){
    intakeWaitTimer = setInterval(async () => {
      await loadState();
      renderIntakeWait(document.getElementById("app"));
    }, 2000);
  }
}

/* ============================ SESSION LIFECYCLE ============================ */
async function start(){
  await loadState();
  render();
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    await loadState();
    if(session && session.role==="hulpdienst"){
      const u = state.units.find(x=>x.id===session.unitId);
      if(u){ u.lastSeen = Date.now(); await saveState(); }
      updateHulpdienstLiveParts();
    } else if(session && session.role==="meldkamer"){
      updateMeldkamerLiveParts();
    }
  }, 2500);
}
function logout(){
  session = null;
  if(pollTimer) clearInterval(pollTimer);
  render();
}

/* ============================ MELDKAMER VIEW ============================ */
function renderMeldkamer(app){
  const now = new Date();
  app.innerHTML = `
    <div class="topbar">
      <div class="topbar-left">
        <div class="brand">Meldkamer Systeem 2025 <span class="sub">Made By Lars B.</span></div>
        <span class="pill">${escapeHtml(session.naam)} — ${escapeHtml(session.stad)}</span>
      </div>
      <div class="topbar-right">
        <span class="clock" id="clock">${now.toLocaleString('nl-NL')}</span>
        <button class="logout" id="logout">Uitloggen</button>
      </div>
    </div>
    <div class="board">
      <div class="panel">
        <div class="panel-head"><span>⚠️ Openstaande Meldingen</span><button class="icon-btn" id="newMelding">+</button></div>
        <div class="panel-body" id="openstaand" style="max-height:70vh;"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><span>⚠️ Uitgegeven Meldingen</span></div>
        <div class="panel-body" id="uitgegeven" style="max-height:70vh;"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><span>👥 Eenheden (ingeklokt, alle steden)</span></div>
        <div class="panel-body" id="eenheden" style="max-height:70vh;"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><span>🙋 Intake verzoeken</span></div>
        <div class="panel-body" id="intakes" style="max-height:32vh;"></div>
        <div class="panel-head" style="border-top:1px solid var(--line);"><span>📨 Verzoeken</span></div>
        <div class="panel-body" id="verzoeken" style="max-height:32vh;"></div>
      </div>
    </div>`;
  document.getElementById("logout").onclick = logout;
  document.getElementById("newMelding").onclick = openNewMeldingModal;
  updateMeldkamerLiveParts();
}

function updateMeldkamerLiveParts(){
  if(!session || session.role!=="meldkamer") return;
  const clock = document.getElementById("clock");
  if(clock) clock.textContent = new Date().toLocaleString('nl-NL');

  const open = state.meldingen.filter(m=>m.status==="openstaand");
  const uitg = state.meldingen.filter(m=>m.status==="uitgegeven");

  const openEl = document.getElementById("openstaand");
  if(openEl){
    openEl.innerHTML = open.length ? open.map(m=>`
      <div class="melding-card" data-melding="${m.id}" ondragover="event.preventDefault(); this.classList.add('drag-over');" ondragleave="this.classList.remove('drag-over');" ondrop="window.__dropUnitOnMelding(event,'${m.id}')" onclick="window.__openUnitPicker('${m.id}')">
        <div class="m-top"><span>${escapeHtml(m.locatie||'Onbekende locatie')}</span><span>${m.tijd}</span></div>
        <div class="m-tekst">${escapeHtml(m.tekst)}</div>
        <div class="m-tags">Kanaal: ${escapeHtml(m.kanaal||'-')} — sleep een eenheid hierheen of klik om toe te wijzen</div>
      </div>`).join("") : `<div class="empty-hint">Geen openstaande meldingen. Klik + om een melding te maken.</div>`;
  }
  const uitgEl = document.getElementById("uitgegeven");
  if(uitgEl){
    uitgEl.innerHTML = uitg.length ? uitg.map(m=>{
      const u = state.units.find(u=>u.id===m.unitId);
      return `<div class="melding-card uitgegeven">
        <div class="m-top"><span>${escapeHtml(m.locatie||'Onbekende locatie')}</span><span>${m.tijd}</span></div>
        <div class="m-tekst">${escapeHtml(m.tekst)}</div>
        <div class="m-tags">Eenheid: ${u? DIENSTEN[u.dienst].em+' '+escapeHtml(u.callsign)+' ('+escapeHtml(u.stad)+')':'-'}</div>
      </div>`;
    }).join("") : `<div class="empty-hint">Nog geen meldingen uitgegeven.</div>`;
  }
  const uEl = document.getElementById("eenheden");
  if(uEl){
    uEl.innerHTML = state.units.length ? state.units.map(u=>`
      <div class="unit-row" draggable="true" ondragstart="window.__dragUnit(event,'${u.id}')" ondragend="this.classList.remove('dragging')" onclick="window.__openUnitAssign('${u.id}')">
        <div class="u-left">
          <span class="unit-em">${DIENSTEN[u.dienst].em}</span>
          <div>
            <div class="u-name"><span class="online-dot ${isOnline(u)?'on':'off'}"></span>${escapeHtml(u.callsign)}</div>
            <div class="u-sub">${DIENSTEN[u.dienst].label} — ${escapeHtml(u.stad)} — ${isOnline(u)?'ingeklokt':'offline'}</div>
          </div>
        </div>
        <span class="u-status ${statusClass(u.status)}">${u.status}</span>
      </div>`).join("") : `<div class="empty-hint">Nog geen eenheden ingeklokt.</div>`;
  }
  const iEl = document.getElementById("intakes");
  if(iEl){
    const wachtend = state.intakes.filter(i=>i.status==="wachtend");
    iEl.innerHTML = wachtend.length ? wachtend.map(i=>`
      <div class="req-item">
        <b>${DIENSTEN[i.dienst].em} ${escapeHtml(i.naam)} — wil ${DIENSTEN[i.dienst].label.toLowerCase()}</b>
        ${escapeHtml(i.bericht||'(geen toelichting)')} <br><span style="color:var(--muted);">${i.tijd}</span>
        <div class="req-actions">
          <button class="btn-mini btn-approve" onclick="window.__decideIntake('${i.id}','goedgekeurd')">Goedkeuren</button>
          <button class="btn-mini btn-reject" onclick="window.__decideIntake('${i.id}','afgewezen')">Afwijzen</button>
        </div>
      </div>`).join("") : `<div class="empty-hint">Geen openstaande intakes.</div>`;
  }
  const vEl = document.getElementById("verzoeken");
  if(vEl){
    const list = [...state.verzoeken].reverse().slice(0,20);
    vEl.innerHTML = list.length ? list.map(v=>`
      <div class="req-item ${v.type==='noodknop'?'nood':''}">
        <b>${v.type==='noodknop'?'🔴 NOODKNOP':(v.type==='spraak_urgent'?'🗣️ Spraak URGENT':'🗣️ Spraakaanvraag')} — ${escapeHtml(v.callsign)}</b>
        ${v.tijd}
        ${v.status==='open' ? `
          <div class="req-actions">
            <button class="btn-mini btn-approve" onclick="window.__decideVerzoek('${v.id}','goedgekeurd')">Goedkeuren</button>
            <button class="btn-mini btn-reject" onclick="window.__decideVerzoek('${v.id}','afgewezen')">Afwijzen</button>
          </div>` : `<span class="status-tag ${v.status}">${v.status}</span>`}
      </div>`).join("") : `<div class="empty-hint">Geen verzoeken.</div>`;
  }
}

/* drag & drop */
window.__dragUnit = function(ev, unitId){
  ev.dataTransfer.setData("text/plain", unitId);
  ev.currentTarget.classList.add("dragging");
};
window.__dropUnitOnMelding = async function(ev, meldingId){
  ev.preventDefault();
  ev.currentTarget.classList.remove("drag-over");
  const unitId = ev.dataTransfer.getData("text/plain");
  if(!unitId) return;
  await assignUnitToMelding(unitId, meldingId);
};
async function assignUnitToMelding(unitId, meldingId){
  await loadState();
  const melding = state.meldingen.find(x=>x.id===meldingId);
  const unit = state.units.find(x=>x.id===unitId);
  if(melding && unit && melding.status==="openstaand"){
    melding.status = "uitgegeven";
    melding.unitId = unit.id;
    unit.meldingId = melding.id;
    unit.status = "Aanrijdend";
    await saveState();
    updateMeldkamerLiveParts();
  }
}

/* new melding modal */
function openNewMeldingModal(){
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `
    <div class="modal">
      <h3>Nieuwe melding</h3>
      <div class="field"><label>Melding</label><textarea id="mTekst" rows="3" placeholder="Omschrijving van de melding"></textarea></div>
      <div class="field"><label>Locatie</label><input id="mLocatie" placeholder="bv. Damrak 1, Amsterdam"></div>
      <div class="field"><label>Incidentenkanaal</label><input id="mKanaal" placeholder="bv. Kanaal 3"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="cancel">Annuleren</button>
        <button class="btn" id="save">Opslaan</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  bg.querySelector("#cancel").onclick = () => bg.remove();
  bg.querySelector("#save").onclick = async () => {
    const tekst = bg.querySelector("#mTekst").value.trim();
    if(!tekst){ alert("Vul een omschrijving in."); return; }
    const melding = { id: uid(), tekst, locatie: bg.querySelector("#mLocatie").value.trim(), kanaal: bg.querySelector("#mKanaal").value.trim(),
      tijd: new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}), status:"openstaand", unitId:null };
    await loadState();
    state.meldingen.push(melding);
    await saveState();
    bg.remove();
    updateMeldkamerLiveParts();
  };
}

window.__openUnitPicker = function(meldingId){
  const units = state.units.filter(u=>isOnline(u));
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `
    <div class="modal">
      <h3>Wijs een eenheid toe</h3>
      <p style="color:var(--muted); font-size:13px; margin-top:-10px;">Je kunt een eenheid ook direct naar de melding slepen.</p>
      <div class="field"><select id="unitSel">
        <option value="">— Kies eenheid —</option>
        ${units.map(u=>`<option value="${u.id}">${DIENSTEN[u.dienst].label} ${u.callsign} (${u.stad})</option>`).join("")}
      </select></div>
      <div class="modal-actions">
        <button class="btn ghost" id="cancel">Sluiten</button>
        <button class="btn" id="assign">Toewijzen</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  bg.querySelector("#cancel").onclick = () => bg.remove();
  bg.querySelector("#assign").onclick = async () => {
    const uid_ = bg.querySelector("#unitSel").value;
    if(uid_){ await assignUnitToMelding(uid_, meldingId); }
    bg.remove();
  };
};
window.__openUnitAssign = function(unitId){
  const u = state.units.find(x=>x.id===unitId);
  if(!u) return;
  const openMeldingen = state.meldingen.filter(m=>m.status==="openstaand");
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `
    <div class="modal">
      <h3>${DIENSTEN[u.dienst].em} ${escapeHtml(u.callsign)} — ${escapeHtml(u.stad)}</h3>
      <p style="color:var(--muted); font-size:13px;">Huidige status: <b style="color:var(--text)">${u.status}</b> — ${isOnline(u)?'ingeklokt':'offline'}</p>
      <div class="field"><label>Wijs openstaande melding toe</label>
        <select id="assignSel"><option value="">— Geen melding —</option>
        ${openMeldingen.map(m=>`<option value="${m.id}">${escapeHtml(m.tekst).slice(0,50)}</option>`).join("")}
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" id="cancel">Sluiten</button>
        <button class="btn" id="assign">Toewijzen</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  bg.querySelector("#cancel").onclick = () => bg.remove();
  bg.querySelector("#assign").onclick = async () => {
    const mid = bg.querySelector("#assignSel").value;
    if(mid){ await assignUnitToMelding(unitId, mid); }
    bg.remove();
  };
};
window.__decideIntake = async function(id, decision){
  await loadState();
  const intake = state.intakes.find(x=>x.id===id);
  if(!intake) return;
  intake.status = decision;
  if(decision === "goedgekeurd"){
    const unit = { id: uid(), dienst: intake.dienst, callsign: intake.naam, stad: session ? session.stad : "Onbekend", status:"Inzetbaar", meldingId:null, lastSeen: Date.now() };
    state.units.push(unit);
    intake.unitId = unit.id;
  }
  await saveState();
  updateMeldkamerLiveParts();
};
window.__decideVerzoek = async function(id, decision){
  await loadState();
  const v = state.verzoeken.find(x=>x.id===id);
  if(!v) return;
  v.status = decision;
  await saveState();
  updateMeldkamerLiveParts();
};

/* ============================ HULPDIENST VIEW ============================ */
function renderHulpdienst(app){
  const u = state.units.find(x=>x.id===session.unitId) || {status:"Inzetbaar", dienst:session.dienst, callsign:session.callsign, stad:session.stad};
  app.innerHTML = `
    <div class="topbar">
      <div class="topbar-left">
        <div class="brand">Meldkamer Systeem 2025 <span class="sub">Made By Lars B.</span></div>
      </div>
      <div class="topbar-right">
        <span class="pill">${DIENSTEN[u.dienst].em} ${escapeHtml(u.callsign)} — ${escapeHtml(u.stad)}</span>
        <span class="pill" id="statusPill">${u.status}</span>
        <button class="logout" id="logout">Uitloggen</button>
      </div>
    </div>
    <div class="grid3">
      <div class="panel">
        <div class="panel-head"><span>⚠️ Melding</span></div>
        <div class="panel-body" id="meldingView" style="max-height:34vh;"></div>
        <div class="panel-head" style="border-top:1px solid var(--line);"><span>📨 Mijn verzoeken</span></div>
        <div class="panel-body" id="mijnVerzoeken" style="max-height:22vh;"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><span>📝 Kladblok</span><span style="color:var(--muted); font-weight:400;">${new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})}</span></div>
        <textarea class="kladblok" id="kladblok" placeholder="Maak hier notities aan."></textarea>
      </div>
      <div class="panel">
        <div class="panel-head"><span>${DIENSTEN[u.dienst].em} ${escapeHtml(u.callsign)}</span><span style="color:var(--muted); font-weight:400;">${escapeHtml(u.stad)}</span></div>
        <div class="status-grid" id="statusGrid"></div>
      </div>
    </div>`;
  document.getElementById("logout").onclick = logout;
  buildStatusGrid();
  updateHulpdienstLiveParts();
}

function buildStatusGrid(){
  const grid = document.getElementById("statusGrid");
  if(!grid) return;
  const items = [
    {label:"Inzetbaar", action:()=>setUnitStatus("Inzetbaar")},
    {label:"Aanrijdend", action:()=>setUnitStatus("Aanrijdend")},
    {label:"Ter Plaatse", action:()=>setUnitStatus("Ter Plaatse")},
    {label:"Niet Inzetbaar", action:()=>setUnitStatus("Niet Inzetbaar")},
    {label:"Retour", action:()=>setUnitStatus("Retour")},
    {label:"Spraakaanvraag", action:()=>sendVerzoek("spraak")},
    {label:"Spraakaanvraag URGENT", action:()=>sendVerzoek("spraak_urgent")},
    {label:"Eigen Initiatief", action:()=>setUnitStatus("Eigen Initiatief")},
    {label:"NOODKNOP", nood:true, action:()=>sendVerzoek("noodknop")},
  ];
  grid.innerHTML = items.map((it,i)=>`<div class="status-btn ${it.nood?'nood':''}" data-i="${i}">${it.label}</div>`).join("");
  grid.querySelectorAll(".status-btn").forEach((el,i)=>{ el.onclick = () => items[i].action(); });
}

async function setUnitStatus(status){
  await loadState();
  const u = state.units.find(x=>x.id===session.unitId);
  if(u){
    u.status = status;
    u.lastSeen = Date.now();
    await saveState();
    showToast("Status aangepast!");
    updateHulpdienstLiveParts();
  }
}
async function sendVerzoek(type){
  await loadState();
  const u = state.units.find(x=>x.id===session.unitId);
  if(!u) return;
  const v = { id: uid(), unitId:u.id, callsign:u.callsign, type, status:"open",
    tijd: new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}) };
  state.verzoeken.push(v);
  seenVerzoekStatus[v.id] = "open";
  await saveState();
  showToast(type==="noodknop" ? "Noodknop verzonden!" : "Verzoek verzonden!");
  updateHulpdienstLiveParts();
}
function showToast(msg){
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2700);
}

function updateHulpdienstLiveParts(){
  if(!session || session.role!=="hulpdienst") return;
  const u = state.units.find(x=>x.id===session.unitId);
  if(!u) return;
  const pill = document.getElementById("statusPill");
  if(pill){ pill.textContent = u.status; }

  document.querySelectorAll(".status-btn").forEach(btn=>{
    const label = btn.textContent.trim();
    if(label === u.status){ btn.classList.add("active"); } else { btn.classList.remove("active"); }
  });

  const mView = document.getElementById("meldingView");
  if(mView){
    const m = u.meldingId ? state.meldingen.find(x=>x.id===u.meldingId) : null;
    mView.innerHTML = m ? `<div class="melding-view">
<b>Locatie:</b> ${escapeHtml(m.locatie||'-')}
<b>Incidentenkanaal:</b> ${escapeHtml(m.kanaal||'-')}
<b>Tijd:</b> ${m.tijd}

${escapeHtml(m.tekst)}
      </div>` : `<div class="empty-hint" style="padding:16px;">Geen melding toegewezen.</div>`;
  }
  const mv = document.getElementById("mijnVerzoeken");
  if(mv){
    const mine = state.verzoeken.filter(v=>v.unitId===u.id).slice(-6).reverse();
    mv.innerHTML = mine.length ? mine.map(v=>{
      if(seenVerzoekStatus[v.id] !== undefined && seenVerzoekStatus[v.id] !== v.status && v.status !== "open"){
        showToast(v.status === "goedgekeurd" ? "Verzoek goedgekeurd!" : "Verzoek afgewezen.");
      }
      seenVerzoekStatus[v.id] = v.status;
      return `<div class="mini-verzoek"><span>${v.type==='noodknop'?'🔴 Noodknop':(v.type==='spraak_urgent'?'🗣️ Urgent':'🗣️ Spraak')} ${v.tijd}</span><span class="status-tag ${v.status==='open'?'wachtend':v.status}">${v.status==='open'?'wachtend':v.status}</span></div>`;
    }).join("") : `<div class="empty-hint">Nog geen verzoeken verstuurd.</div>`;
  }
}

/* ============================ INIT ============================ */
render();
</script>
</body>
</html>
